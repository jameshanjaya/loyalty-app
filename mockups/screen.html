function coin(n) {
  return `<span class="poin"><span class="coin">${LEAF}</span><b>${n}</b> Poin</span>`;
}
function nav(on) {
  return `<nav class="tabbar">${NAV.map(([id, label, icon]) => `<a class="${on === id ? "on" : ""}" href="screen.html?brand=${brand.key}&screen=${id}">${icon}<span>${label}</span></a>`).join("")}</nav>`;
}
function stamps(n) {
  const icon = brand.stamp === "bowl" ? BOWL : brand.stamp === "plate" ? PLATE : WHISK;
  let html = "";
  for (let i = 1; i <= 10; i++) {
    const on = i <= n;
    html += `<div class="stamp${on ? " on" : ""}${i === n ? " fresh" : ""}">${icon}</div>`;
  }
  return `<div class="stamps">${html}</div>`;
}
function ring(pct) {
  const c = 2 * Math.PI * 28;
  const off = c * (1 - pct / 100);
  return `<div class="ring">${`<svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="28" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="7"/><circle cx="36" cy="36" r="28" fill="none" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 36 36)"/></svg>`}<b>${pct}</b></div>`;
}
function burst() {
  return `<div class="burst" aria-hidden="true">${"<i></i>".repeat(6)}</div>`;
}
function qr() {
  const n = 21;
  let h = brand.key.length * 17;
  const cells = [];
  const finder = (x, y) => {
    const boxes = [[0, 0], [n - 7, 0], [0, n - 7]];
    return boxes.some(([ox, oy]) => x >= ox && x < ox + 7 && y >= oy && y < oy + 7);
  };
  const finderOn = (x, y) => {
    const boxes = [[0, 0], [n - 7, 0], [0, n - 7]];
    for (const [ox, oy] of boxes) {
      if (x < ox || y < oy || x >= ox + 7 || y >= oy + 7) continue;
      const lx = x - ox, ly = y - oy;
      if (lx === 0 || ly === 0 || lx === 6 || ly === 6) return true;
      if (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4) return true;
      return false;
    }
    return false;
  };
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      h = (h * 33 + x * 13 + y) % 97;
      const on = finder(x, y) ? finderOn(x, y) : h > 46;
      if (on) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
    }
  }
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">${cells.join("")}</svg>`;
}

    <article class="quest locked">
      <div class="qico">?</div>

        <h3>Quest rahasia</h3>
        <p class="fine">Selesain quest dulu. Ada kejutan yang belum keliatan.</p>

}
